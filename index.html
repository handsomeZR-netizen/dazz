<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0a0a" />
  <title>NC Cam</title>
</head>
<body>
  <div id="app">
    <!-- 取景器 -->
    <!-- grid: 顶栏 / 取景器 / 预设条 / 底部控件 -->
    <main class="viewfinder">
      <div class="body" id="body" data-preset="NC" data-brand="NC-FILM">
        <div class="body-top">
          <span class="dial dial-l"></span>
          <span class="brand-plate" id="bodyBrand">NC-FILM</span>
          <span class="dial dial-r"></span>
        </div>
        <div class="frame">
          <video id="video" autoplay playsinline muted></video>
          <canvas id="preview"></canvas>

          <!-- 取景器装饰 -->
          <div class="overlay">
            <div class="brand">NC</div>
            <div class="datestamp" id="datestamp">'26 4 30</div>
            <div class="corner tl"></div>
            <div class="corner tr"></div>
            <div class="corner bl"></div>
            <div class="corner br"></div>
          </div>

          <!-- 拍照闪屏 -->
          <div class="flash" id="flash"></div>
        </div>
        <div class="body-bottom">
          <span class="grip"></span>
        </div>
      </div>
    </main>

    <!-- 顶部状态栏 -->
    <header class="topbar">
      <button class="icon-btn" id="flipBtn" title="翻转摄像头" aria-label="翻转摄像头">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
          <path fill="currentColor" d="M20 5h-3.2L15 3H9L7.2 5H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2zm-8 13a5 5 0 0 1-5-5h2l-3-3-3 3h2a7 7 0 0 0 11.9 5l-1.5-1.5A4.96 4.96 0 0 1 12 18zm5-2 3-3h-2a7 7 0 0 0-11.9-5L7.6 9.5A5 5 0 0 1 17 13h-2l3 3z"/>
        </svg>
      </button>
      <div class="filter-tag" id="filterTag">NC · Nostalgic</div>
      <div class="topbar-right">
        <button class="icon-btn" id="importBtn" title="导入图片" aria-label="导入图片">
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
            <path fill="currentColor" d="M19 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2zM5 5h14v9.6l-2.7-2.7a1 1 0 0 0-1.4 0l-2.4 2.4-4.4-4.4a1 1 0 0 0-1.4 0L5 11.6V5zm0 9.4 2.4-2.4 6 6H5v-3.6zm14 4h-2.8l-2.3-2.3 1.7-1.7 3.4 3.4v.6zM15.5 8.5A1.5 1.5 0 1 1 12.5 8.5 1.5 1.5 0 0 1 15.5 8.5z"/>
          </svg>
        </button>
        <input id="importInput" type="file" accept="image/*" hidden />
        <button class="icon-btn" id="effectsBtn" title="特效" aria-label="特效">
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
            <path fill="currentColor" d="m7.5 5.6.9-2.4 2.4-.9-2.4-.9L7.5 0l-.9 2.4L4.2 3.3l2.4.9zM20 16l-1-2-1 2-2 1 2 1 1 2 1-2 2-1zm-1.7-7.3 1-2.7 2.7-1-2.7-1-1-2.7-1 2.7-2.7 1 2.7 1zM10.5 21l1.4-3.6 3.6-1.4-3.6-1.4L10.5 11l-1.4 3.6L5.5 16l3.6 1.4z"/>
          </svg>
        </button>
        <button class="icon-btn" id="borderBtn" title="边框" aria-label="边框">
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
            <path fill="none" stroke="currentColor" stroke-width="2" d="M4 4h16v16H4z"/>
          </svg>
        </button>
        <button class="icon-btn" id="dateBtn" title="日期戳" aria-label="日期戳">
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
            <path fill="currentColor" d="M7 11h2v2H7v-2zm14-5v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6c0-1.1.9-2 2-2h1V2h2v2h8V2h2v2h1a2 2 0 0 1 2 2zm-2 2H5v12h14V8zm-4 3h2v2h-2v-2zm-4 0h2v2h-2v-2z"/>
          </svg>
        </button>
      </div>
    </header>

    <!-- 预设选择条 -->
    <nav class="presets" id="presets" aria-label="滤镜预设"></nav>

    <!-- 底部控制 -->
    <footer class="controls">
      <button class="thumb" id="thumbBtn" aria-label="打开胶卷">
        <span class="thumb-empty">×</span>
        <span class="thumb-count" id="thumbCount" hidden>0</span>
      </button>

      <button class="shutter" id="shutterBtn" aria-label="拍照">
        <span class="shutter-ring"></span>
        <span class="shutter-core"></span>
      </button>

      <button class="filter-btn" id="filterBtn" aria-label="切换强度">
        <span id="strengthLabel">100</span>
      </button>
    </footer>

    <!-- 胶卷相册 -->
    <section class="album" id="album" hidden>
      <header class="album-header">
        <button class="icon-btn" id="albumClose" aria-label="返回">
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
            <path fill="currentColor" d="M15.41 16.59 10.83 12l4.58-4.59L14 6l-6 6 6 6z"/>
          </svg>
        </button>
        <h2 class="album-title">胶卷 · <span id="albumCount">0</span></h2>
        <button class="icon-btn" id="albumExport" aria-label="导出全部">
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
            <path fill="currentColor" d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/>
          </svg>
        </button>
      </header>
      <div class="album-grid" id="albumGrid"></div>
      <div class="album-empty" id="albumEmpty">还没有拍过照片</div>
    </section>

    <!-- 单张详情模态 -->
    <div class="modal" id="modal" hidden>
      <header class="modal-header">
        <button class="icon-btn" id="closeModal" aria-label="关闭">
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
            <path fill="currentColor" d="M19 6.41 17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/>
          </svg>
        </button>
        <span class="modal-meta" id="modalMeta"></span>
        <button class="icon-btn danger" id="deleteBtn" aria-label="删除">
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
            <path fill="currentColor" d="M6 19a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/>
          </svg>
        </button>
      </header>
      <div class="modal-img-wrap">
        <img id="modalImg" alt="拍摄结果" />
      </div>
      <footer class="modal-actions">
        <a class="primary" id="downloadBtn" download="dazz.jpg">保存到相册</a>
      </footer>
    </div>

    <!-- 特效抽屉 -->
    <aside class="fx-drawer" id="fxDrawer" hidden>
      <div class="fx-drawer-inner">
        <div class="fx-drawer-handle"></div>
        <h3 class="fx-title">特效</h3>
        <button class="fx-toggle" data-fx="halation">
          <span class="fx-name">光晕 / Halation</span>
          <span class="fx-status">关</span>
        </button>
        <button class="fx-toggle" data-fx="fisheye">
          <span class="fx-name">鱼眼 / Fisheye</span>
          <span class="fx-status">关</span>
        </button>
        <button class="fx-toggle" data-fx="flash" data-arm="true">
          <span class="fx-name">闪光灯 / Flash</span>
          <span class="fx-status">关</span>
        </button>
      </div>
    </aside>

    <!-- 提示 -->
    <div class="toast" id="toast" hidden></div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
